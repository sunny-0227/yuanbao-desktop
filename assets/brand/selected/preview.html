<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元宝 · 品牌配色与素材</title><style>:root{--bg:#F8F4EC;--panel:#FFFCF6;--text:#263F3C;--muted:#62736B;--border:#DCDCD0;--accent:#315D59;--active:#E1ECE5;--primary:#315D59;--on_primary:#FFF8E9;--gold_surface:#F5E3B9;--on_gold:#68472E}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"PingFang SC",sans-serif;transition:background .2s,color .2s}main{max-width:1080px;margin:auto;padding:32px 24px}header{display:flex;gap:24px;align-items:center}header img{width:128px;border-radius:20px}h1{font-size:30px;margin:0 0 12px}p{color:var(--muted);line-height:1.8}button{border:1px solid var(--border);padding:10px 16px;border-radius:7px;background:var(--panel);color:var(--text);cursor:pointer}button.primary{background:var(--primary);color:var(--on_primary)}.themes{display:flex;gap:12px;margin:24px 0}.swatches{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.swatch{padding:16px;border-radius:10px;min-width:180px}.sample{padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:12px}.badge{display:inline-block;padding:6px 10px;background:var(--gold_surface);color:var(--on_gold);border-radius:6px}.reply{margin:16px 0;padding:16px;background:var(--active);border-radius:8px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px}figure img{width:100%;display:block}figcaption{text-align:center;padding-top:12px}@media(max-width:650px){header{align-items:start}header img{width:80px}.states{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}</style><main><header><img src="logo.png" alt="B2 元宝Logo"><div><h1>元宝 · 统一品牌色</h1><p>以选定B2为基准。下方是配色和素材预览，不是Windows软件截图。</p></div></header><div class="themes"><button onclick="setTheme('light')">浅色主题</button><button onclick="setTheme('dark')">深色主题</button></div><div class="swatches"><div class="swatch" style="background:#315D59;color:#FFF8E9">深青绿 · #315D59</div><div class="swatch" style="background:#F5E3B9;color:#68472E">暖奶油 · #F5E3B9</div><div class="swatch" style="background:#C98A3A;color:#263F3C">金焦糖 · #C98A3A</div></div><section class="sample"><span class="badge">长毛金虎斑猫</span><h2>随时说一句，元宝来帮你</h2><div class="reply">已帮你记下，十分钟后提醒你喝水。</div><button>新对话</button> <button class="primary">发送</button></section><h2>六个透明静态状态</h2><div class="states"><figure><img src="../../pet/default/idle.png" alt="元宝待机"><figcaption>待机</figcaption></figure><figure><img src="../../pet/default/listening.png" alt="元宝聆听"><figcaption>聆听</figcaption></figure><figure><img src="../../pet/default/thinking.png" alt="元宝思考"><figcaption>思考</figcaption></figure><figure><img src="../../pet/default/speaking.png" alt="元宝播报"><figcaption>播报</figcaption></figure><figure><img src="../../pet/default/working.png" alt="元宝执行"><figcaption>执行</figcaption></figure><figure><img src="../../pet/default/sleep.png" alt="元宝休眠"><figcaption>休眠</figcaption></figure></div><p>提示词与原生尺寸保存在assets/pet/prompts。桌面运行时按显示尺寸缓存，素材文件保持原始分辨率。</p></main><script>const themes={"light": {"bg": "#F8F4EC", "panel": "#FFFCF6", "text": "#263F3C", "muted": "#62736B", "border": "#DCDCD0", "accent": "#315D59", "active": "#E1ECE5", "primary": "#315D59", "on_primary": "#FFF8E9", "gold_surface": "#F5E3B9", "on_gold": "#68472E"}, "dark": {"bg": "#152D2B", "panel": "#1D3B38", "text": "#F5E9D4", "muted": "#B0BFB4", "border": "#3A5B55", "accent": "#A5D3C1", "active": "#2B4D47", "primary": "#376E67", "on_primary": "#FFF8E9", "gold_surface": "#72552D", "on_gold": "#F5E3B9"}};function setTheme(name){Object.entries(themes[name]).forEach(([key,value])=>document.documentElement.style.setProperty('--'+key,value));}</script></html>
