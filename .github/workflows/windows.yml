name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-win.txt
      - run: python -m ruff check app services ui main.py scripts tests
      - run: python -m pytest -q
      - name: Build Yuanbao.exe
        run: python scripts/build_exe.py --onefile
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Yuanbao-Windows-x64
          path: dist/Yuanbao.exe
          if-no-files-found: error
          retention-days: 30
