name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-win.txt
      - run: python -m ruff check app services ui main.py scripts tests
      - run: python -m pytest -q
      - run: python scripts/build_exe.py
